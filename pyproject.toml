[project]
name = "tieba-time-machine"
version = "0.1.0"
description = "Full-pipeline toolkit for archiving Baidu Tieba forums and reading them offline."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aiotieba>=4.4.9",
    "orjson>=3.10.3",
    "aiohttp>=3.9.5",
    "aiofiles>=24.1.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
tieba = "tieba_time_machine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tieba_time_machine"]
